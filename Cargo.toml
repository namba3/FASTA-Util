[package]
name = "fasta-util"
version = "0.1.0"
description = "A streaming FASTA CLI for sequence analysis and extraction"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"

[dev-dependencies]
crossbeam = "0.8"

[[bench]]
name = "nucleic_acid"
harness = false

[[bench]]
name = "fasta_io"
harness = false
