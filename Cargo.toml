[package]
name = "fasta-util"
version = "0.1.0"
description = "A streaming FASTA CLI for sequence length and slicing"
edition = "2024"
rust-version = "1.88"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam = "0.8"
memmap2 = "0.9"

[[bench]]
name = "nucleic_acid"
harness = false
